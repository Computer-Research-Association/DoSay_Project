<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Apple Game 알고리즘 비교 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b92a3;
    --accent: #ff5c5c;
    --accent2: #5c9dff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Pretendard", "Segoe UI", sans-serif;
    margin: 0;
    padding: 32px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .panel h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.03em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  tr:hover td { background: #1d212b; }
  .best { color: #6fe08f; font-weight: 600; }
  canvas { max-height: 320px; }
</style>
</head>
<body>
  <h1>🍎 Apple Game 알고리즘 비교 대시보드</h1>
  <div class="meta" id="meta"></div>

  <div class="grid">
    <div class="panel">
      <h2>평균 점수 (avg_score)</h2>
      <canvas id="avgScoreChart"></canvas>
    </div>
    <div class="panel">
      <h2>안정성: 평균 vs 표준편차</h2>
      <canvas id="stabilityChart"></canvas>
    </div>
    <div class="panel">
      <h2>올클리어 비율 (clear_rate)</h2>
      <canvas id="clearRateChart"></canvas>
    </div>
    <div class="panel">
      <h2>평균 턴 수 (avg_turn)</h2>
      <canvas id="avgTurnChart"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2>상세 수치</h2>
    <table id="table"></table>
  </div>

<script>
const DATA = {"generated_at": "2026-07-21T18:39:07", "n_games": 3, "git": {"commit": "f3d7bf2cea0971f4c203331cb49f578a22dedcca", "dirty": false}, "feature_snapshot": {"remove_nine": {"default_weight": 1.0, "source": "def feature_remove_nine(ctx: FeatureContext) -> float:\n    area = ctx.board_array\n    if not(area == 7).any(): #격자 안에 9가 없을시 0을 return한다\n        return 0.0\n    nine_count = int((area==9).sum()) #area안에 9가 있는 수의 개수\n    if not _has_nine_one_pair(ctx): #9와 짝 지어지는 경우의 수가 판 내에 존재하는지\n        return 0.0\n    return sigmoid(nine_count, k = 0.5, x0 = 3.0) #추후 이 값을 조정하면서 k 값과 x0 값을 찾아도 됨\n", "source_hash": "ebcd207c4a1f"}, "remove_eight": {"default_weight": 1.0, "source": "def feature_remove_eight(ctx: FeatureContext) -> float:\n    area = ctx.board_array\n    if not(area == 8).any():\n        return 0.0\n    eight_count = int((area==8).sum()) \n    if not _has_eight_pair(ctx):\n        return 0.0\n    return sigmoid(eight_count, k = 0.5, x0 = 3.0)\n", "source_hash": "5cf66e82ee82"}, "grouping": {"default_weight": 1.0, "source": "def feature_remove_the_most_grouping(ctx: FeatureContext) -> float:\n    \n    return float((ctx.area != 0).sum()) / ctx.area.size\n", "source_hash": "267e7f89adf9"}}, "runs": [{"name": "from_simulator_default", "weights": {"remove_nine": 9.0, "remove_the_most_grouping": 3.0}, "summary": {"n_games": 3, "max_score": 118, "min_score": 89, "avg_score": 99.66666666666667, "std_score": 13.021349989749739, "avg_turn": 42.0, "avg_time": 0.2482827333321135, "avg_max_score_ratio": 0.6152263374485597, "clear_rate": 0.0}}]};

const runs = DATA.runs;
const labels = runs.map(r => r.name);
const colors = ["#ff5c5c", "#5c9dff", "#6fe08f", "#f7c948", "#c084fc", "#4fd1c5", "#f97316", "#a3a3a3"];

document.getElementById("meta").textContent =
  `생성 시각: ${DATA.generated_at} | 버전당 게임 수: ${DATA.n_games}`;

function bestIndex(key, higherIsBetter = true) {
  let best = 0;
  for (let i = 1; i < runs.length; i++) {
    const a = runs[i].summary[key], b = runs[best].summary[key];
    if (higherIsBetter ? a > b : a < b) best = i;
  }
  return best;
}

const baseOptions = {
  responsive: true,
  plugins: { legend: { display: false } },
  scales: {
    x: { ticks: { color: "#8b92a3" }, grid: { color: "#262b36" } },
    y: { ticks: { color: "#8b92a3" }, grid: { color: "#262b36" } }
  }
};

new Chart(document.getElementById("avgScoreChart"), {
  type: "bar",
  data: {
    labels,
    datasets: [{
      data: runs.map(r => r.summary.avg_score),
      backgroundColor: colors,
    }]
  },
  options: baseOptions
});

new Chart(document.getElementById("clearRateChart"), {
  type: "bar",
  data: {
    labels,
    datasets: [{
      data: runs.map(r => r.summary.clear_rate * 100),
      backgroundColor: colors,
    }]
  },
  options: baseOptions
});

new Chart(document.getElementById("avgTurnChart"), {
  type: "bar",
  data: {
    labels,
    datasets: [{
      data: runs.map(r => r.summary.avg_turn),
      backgroundColor: colors,
    }]
  },
  options: baseOptions
});

new Chart(document.getElementById("stabilityChart"), {
  type: "scatter",
  data: {
    datasets: runs.map((r, i) => ({
      label: r.name,
      data: [{ x: r.summary.avg_score, y: r.summary.std_score }],
      backgroundColor: colors[i % colors.length],
      pointRadius: 8,
    }))
  },
  options: {
    ...baseOptions,
    plugins: {
      legend: { display: true, labels: { color: "#8b92a3" } },
      tooltip: {
        callbacks: {
          label: (ctx) => `${ctx.dataset.label}: avg=${ctx.parsed.x.toFixed(1)}, std=${ctx.parsed.y.toFixed(1)}`
        }
      }
    },
    scales: {
      x: { title: { display: true, text: "avg_score (높을수록 좋음)", color: "#8b92a3" }, ticks: { color: "#8b92a3" }, grid: { color: "#262b36" } },
      y: { title: { display: true, text: "std_score (낮을수록 안정적)", color: "#8b92a3" }, ticks: { color: "#8b92a3" }, grid: { color: "#262b36" } }
    }
  }
});

// 상세 테이블
const bestAvg = bestIndex("avg_score", true);
const bestStd = bestIndex("std_score", false);
const bestClear = bestIndex("clear_rate", true);

const cols = [
  ["name", "버전"],
  ["avg_score", "평균 점수"],
  ["std_score", "표준편차"],
  ["max_score", "최고 점수"],
  ["min_score", "최저 점수"],
  ["avg_turn", "평균 턴"],
  ["clear_rate", "올클리어율"],
  ["avg_time", "게임당 시간(s)"],
];

let html = "<tr>" + cols.map(c => `<th>${c[1]}</th>`).join("") + "</tr>";
runs.forEach((r, i) => {
  html += "<tr>";
  cols.forEach(([key]) => {
    let val;
    if (key === "name") {
      val = r.name;
    } else {
      const raw = r.summary[key];
      val = key === "clear_rate" ? (raw * 100).toFixed(1) + "%" : raw.toFixed(2);
      if ((key === "avg_score" && i === bestAvg) ||
          (key === "std_score" && i === bestStd) ||
          (key === "clear_rate" && i === bestClear)) {
        val = `<span class="best">${val}</span>`;
      }
    }
    html += `<td>${val}</td>`;
  });
  html += "</tr>";
});
document.getElementById("table").innerHTML = html;
</script>
</body>
</html>
