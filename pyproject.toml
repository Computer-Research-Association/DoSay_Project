[project]
name = "AppleGameAgent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "gymnasium==1.3.0",
    "numpy==2.5.1",
    "sb3_contrib==2.9.0",
    "stable_baselines3==2.9.0",
    "torch==2.12.1",
    "tensorboard==2.21.0",
]
 
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
 
[tool.setuptools.packages.find]
include = ["ai*", "algorithm*", "game*"]
exclude = ["test*", "runs*"]
 